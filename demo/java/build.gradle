plugins {
    id 'java'
}

group = 'com.techreview'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'               // SQLite (MES 샘플 DB, 인덱스)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.1' // JSON
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.1.0'          // MCP 서버 (공식 Java SDK)
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.1.0' // MCP JSON (Jackson 2)
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.13'                        // sqlite-jdbc의 로그 경고 끄기
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// 실행 가능한 단일 jar: build/libs/demo.jar
tasks.register('fatJar', Jar) {
    archiveFileName = 'demo.jar'
    manifest { attributes 'Main-Class': 'com.techreview.Main' }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
build.dependsOn fatJar
